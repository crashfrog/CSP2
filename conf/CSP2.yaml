name: csp2_env

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.8.1
  - bedtools
  - mash
  - skesa
  - mummer        # retained for Phase A equivalence testing; dropped in Phase B once phraya ships --format snpdiffs
  - bbmap
  - phraya        # replaces dnadiff; requires phraya >=0.2.0 (snpdiffs output format, see docs/phraya-snpdiffs-output-handoff.md)
  - pandas
  - biopython
  - scikit-learn
  - matplotlib
  - seaborn
  - pybedtools
  - iqtree
